name: Nightly

# Three measurements per agent, each its own job so each has its own time
# budget and its own red mark:
#
#   modes    every mode the registry gives the agent, mock and belt hooks
#            (the same runs as the per-agent push workflows, against the
#            agents' releases of the night)
#   probes   the session phase with the full probe set, compared with
#            tests/expected/<agent>.json; any difference fails
#   surface  the CLI's top-level commands and long flags from --help,
#            compared with tests/expected/<agent>.surface.txt; any change fails
#
# README.md (CI) says how to regenerate the expected files after a deliberate
# change.

on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily
  workflow_dispatch:
    inputs:
      agents:
        description: 'Agents to run (comma separated; empty for all)'
        required: false
        default: ''

# The conformance suite is the conformance/ module of this repository.
defaults:
  run:
    working-directory: conformance

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.plan.outputs.agents }}
      probes: ${{ steps.plan.outputs.probes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: conformance/go.mod
      - id: plan
        # Agents and their modes come from the registry. The probe set runs for
        # every agent with a session driver and a committed expected file.
        env:
          WANT: ${{ inputs.agents }}
        run: |
          go run . --list --json > registry.json
          agents=$(jq -c --arg want "$WANT" '
            ($want | split(",") | map(select(. != ""))) as $w
            | [.[] | select((.ci_modes | length) > 0)
                   | select(($w | length) == 0 or (.name as $n | $w | index($n)))
                   | {name, modes: (.ci_modes | join(",")), docker: (if .needs_intercept then "--user root" else "" end), flags: (if .needs_intercept then "--intercept" else "" end)}]' registry.json)
          probes=$(echo "$agents" | jq -c '[.[] | select(.modes | split(",") | index("acp")) | .name]' )
          probes=$(for a in $(echo "$probes" | jq -r '.[]'); do [ -f "tests/expected/$a.json" ] && echo "$a"; done | jq -R . | jq -sc .)
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "probes=$probes" >> "$GITHUB_OUTPUT"
          echo "agents: $agents"
          echo "probes: $probes"

  modes:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.agents) }}
    name: modes (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Docker image
        run: |
          tests/fetch-belt.sh
          docker build -f tests/Dockerfile -t harness-test ..
      - name: Test ${{ matrix.name }} (${{ matrix.modes }})
        id: test
        # Matrix values reach the shell as variables, never as workflow text.
        env:
          NAME: ${{ matrix.name }}
          MODES: ${{ matrix.modes }}
          DOCKER_ARGS: ${{ matrix.docker }}
          FLAGS: ${{ matrix.flags }}
        run: |
          results=""
          read -ra docker_args <<< "$DOCKER_ARGS"
          read -ra flags <<< "$FLAGS"
          for mode in $(echo "$MODES" | tr ',' ' '); do
            # Each mode runs twice: the runner's mock hooks, then the released
            # belt CLI's real hook commands (--hooks belt). --agent-min-age
            # skips a release still publishing its binaries (tests/nightly.sh).
            for hooks in mock belt; do
              echo "=== $NAME ($mode, $hooks hooks) ==="
              hookflag=""; [ "$hooks" = belt ] && hookflag="--hooks belt"
              if timeout 480 docker run --rm "${docker_args[@]}" harness-test --harness "$NAME" --mode $mode $hookflag --agent-min-age 1h "${flags[@]}" 2>&1 | tee /tmp/out.log; then
                results="${results}${mode}/${hooks}:pass,"
              else
                results="${results}${mode}/${hooks}:fail,"
              fi
              ver=$(grep -oP '→ version: \K.*' /tmp/out.log | head -1)
              if [ -n "$ver" ]; then
                echo "version=$ver" >> "$GITHUB_OUTPUT"
              fi
            done
          done
          echo "results=$results" >> "$GITHUB_OUTPUT"
          # Every mode above runs to completion; only now does a failure fail
          # the job, so the summary is complete and the badge is truthful.
          case "$results" in *:fail*) echo "::error::$NAME: $results"; exit 1;; esac
      - name: Report
        if: always()
        # The version is text printed by the agent's own binary.
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ steps.test.outputs.version || 'unknown' }}
          RESULTS: ${{ steps.test.outputs.results }}
        run: |
          echo "### $NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Results**: $RESULTS" >> $GITHUB_STEP_SUMMARY

  probes:
    needs: plan
    if: needs.plan.outputs.probes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.plan.outputs.probes) }}
    name: probes (${{ matrix.agent }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Docker image
        run: |
          tests/fetch-belt.sh
          docker build -f tests/Dockerfile -t harness-test ..
      - name: Probes vs tests/expected/${{ matrix.agent }}.json
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          set -o pipefail
          OUT=$RUNNER_TEMP/probes tests/nightly.sh probes "$AGENT" 2>&1 | tee $RUNNER_TEMP/probes.txt
      - name: Report
        if: always()
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          {
            echo "### probes: $AGENT"
            echo '```'
            sed -n "/^=== $AGENT\\//,\$p" $RUNNER_TEMP/probes.txt | grep -v '^reports in'
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probes-${{ matrix.agent }}
          path: ${{ runner.temp }}/probes
          retention-days: 14

  surface:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.agents) }}
    name: surface (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Docker image
        run: |
          echo '#!/bin/sh' > tests/belt && chmod +x tests/belt
          docker build -f tests/Dockerfile -t harness-test ..
      - name: Commands and flags vs tests/expected/${{ matrix.name }}.surface.txt
        # A changed surface fails this job and nothing else: the version is
        # printed, never compared, so a release that changes nothing on the
        # surface stays green.
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -o pipefail
          OUT=$RUNNER_TEMP/surface tests/nightly.sh surface "$NAME" 2>&1 | tee $RUNNER_TEMP/surface.txt
      - name: Report
        if: always()
        env:
          NAME: ${{ matrix.name }}
        run: |
          {
            echo "### surface: $NAME"
            echo '```'
            sed -n '/^version:/,$p' $RUNNER_TEMP/surface.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          if [ -s $RUNNER_TEMP/surface/surface.diff ]; then
            echo "::error title=$NAME CLI surface changed::$(grep -E '^[+-]' $RUNNER_TEMP/surface/surface.diff | grep -vE '^(\+\+\+|---) ' | tr '\n' ' ')"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-${{ matrix.name }}
          path: ${{ runner.temp }}/surface
          retention-days: 14
