name: Test Harness (reusable)

# Runs every mode the registry gives this agent (harness-test --modes-for), each
# twice: the runner's mock hooks, then the released belt CLI's real hook
# commands (--hooks belt). The mode list is read from the registry at run time,
# so adding a mode to an agent in agentprotocol adds it here.

on:
  workflow_call:
    inputs:
      harness:
        required: true
        type: string
      agent_version:
        # Installs this exact version instead of the latest (--agent-version).
        required: false
        type: string
        default: ""

# The conformance suite is the conformance/ module of this repository.
defaults:
  run:
    working-directory: conformance

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      modes: ${{ steps.modes.outputs.modes }}
      docker: ${{ steps.modes.outputs.docker }}
      flags: ${{ steps.modes.outputs.flags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: conformance/go.mod
      - id: modes
        # The agent name reaches the shell as a variable, never as workflow text.
        env:
          HARNESS: ${{ inputs.harness }}
        run: |
          modes=$(go run . --modes-for "$HARNESS")
          echo "modes=$modes" >> "$GITHUB_OUTPUT"
          # An agent with no BYOK endpoint (kiro) only works through the MITM
          # intercept, which rewrites /etc/hosts and installs a CA: root.
          if go run . --list --json | jq -e --arg name "$HARNESS" '.[] | select(.name == $name) | .needs_intercept == true' > /dev/null; then
            echo "docker=--user root" >> "$GITHUB_OUTPUT"
            echo "flags=--intercept" >> "$GITHUB_OUTPUT"
          fi
          echo "$HARNESS: $modes"

  test:
    needs: plan
    if: needs.plan.outputs.modes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJson(needs.plan.outputs.modes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Docker image
        id: build
        # tests/belt is the released belt CLI from dist.inference.sh; the
        # --hooks belt run installs its real hook commands through the package.
        run: |
          tests/fetch-belt.sh
          docker build -f tests/Dockerfile -t harness-test ..
      - name: Test ${{ matrix.mode }} (mock hooks)
        # Every value reaches the shell as a variable, never as workflow text.
        env:
          HARNESS: ${{ inputs.harness }}
          MODE: ${{ matrix.mode }}
          DOCKER_ARGS: ${{ needs.plan.outputs.docker }}
          FLAGS: ${{ needs.plan.outputs.flags }}
          AGENT_VERSION: ${{ inputs.agent_version }}
        run: |
          read -ra docker_args <<< "$DOCKER_ARGS"
          read -ra flags <<< "$FLAGS"
          docker run --rm "${docker_args[@]}" harness-test --harness "$HARNESS" --mode "$MODE" "${flags[@]}" ${AGENT_VERSION:+--agent-version "$AGENT_VERSION"}
        timeout-minutes: 8
      - name: Test ${{ matrix.mode }} (belt hooks)
        # Runs when the mock-hooks step failed too, not when there is no image.
        if: (success() || failure()) && steps.build.outcome == 'success'
        env:
          HARNESS: ${{ inputs.harness }}
          MODE: ${{ matrix.mode }}
          DOCKER_ARGS: ${{ needs.plan.outputs.docker }}
          FLAGS: ${{ needs.plan.outputs.flags }}
          AGENT_VERSION: ${{ inputs.agent_version }}
        run: |
          read -ra docker_args <<< "$DOCKER_ARGS"
          read -ra flags <<< "$FLAGS"
          docker run --rm "${docker_args[@]}" harness-test --harness "$HARNESS" --mode "$MODE" --hooks belt "${flags[@]}" ${AGENT_VERSION:+--agent-version "$AGENT_VERSION"}
        timeout-minutes: 8
