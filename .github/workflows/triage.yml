name: Triage

# A failed Nightly is sorted by tests/triage.sh from its own artifacts
# (conformance/docs/ci-playbook.md). The new expected files for the drift
# (auto classes) go to the branch triage/<run>. When every failure is drift, a
# nightly for those agents runs on the branch to confirm them; when any needs
# review, the table goes to this job's summary and this job fails.

on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]
    # A confirming nightly on a triage branch reports on that branch.
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: 'Nightly run id to triage'
        required: true

concurrency:
  group: triage
  cancel-in-progress: false

permissions:
  actions: write   # download artifacts, dispatch the confirming nightly
  contents: write  # commit the accepted drift

# The conformance suite is the conformance/ module of this repository.
defaults:
  run:
    working-directory: conformance

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: conformance/go.mod
      - name: Triage nightly ${{ env.RUN }}
        id: triage
        run: |
          status=0
          OUT=$RUNNER_TEMP/triage tests/triage.sh "$RUN" --apply || status=$?
          cat $RUNNER_TEMP/triage/triage.md >> $GITHUB_STEP_SUMMARY
          echo "status=$status" >> $GITHUB_OUTPUT
          [ "$status" -le 1 ] || exit "$status"
      - name: Commit accepted drift
        run: |
          git diff --quiet tests/expected && { echo "nothing to commit"; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          news=$(jq -r '[.items[] | select(.auto and .class != "already-accepted") | "\(.agent) \(.detail)"] | unique | .[]' $RUNNER_TEMP/triage/triage.json)
          agents=$(jq -r '[.items[] | select(.auto and .class != "already-accepted") | .agent] | unique | join(",")' $RUNNER_TEMP/triage/triage.json)
          git add tests/expected
          git commit -q -m "nightly $RUN: accept drift ($agents)" -m "$news" -m "tests/triage.sh $RUN --apply"
          # main takes changes only through a pull request (the organization's
          # ruleset), so the accepted drift goes to a branch for a person to
          # merge. With nothing to review, a nightly for the changed agents
          # runs on that branch to confirm it.
          git push -f origin HEAD:refs/heads/triage/$RUN
          echo "accepted drift on branch triage/$RUN: https://github.com/${{ github.repository }}/compare/main...triage/$RUN" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.triage.outputs.status }}" = 0 ]; then
            gh workflow run nightly.yml --ref triage/$RUN -f agents="$agents"
            echo "confirming nightly dispatched on triage/$RUN for $agents" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Review needed
        if: steps.triage.outputs.status == '1'
        run: |
          echo "::error title=Nightly $RUN needs review::$(jq -r '[.items[] | select(.auto | not) | "\(.class) \(.agent)"] | join(", ")' $RUNNER_TEMP/triage/triage.json) (docs/ci-playbook.md)"
          exit 1
